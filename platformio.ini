; NMX-1108 / NMX-1106 RS-232C 패시브 탭(커플링) 스니퍼
; ESP32 38-pin dev board / Arduino framework
;
;   pio run -t upload      빌드 + 업로드
;   pio device monitor     115200 bps
;
; RX 전용이다. TX 핀은 UART에 할당하지 않으므로 송신할 수 없다.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    ; ---- 탭 RX 핀 변경이 필요하면 아래 주석을 풀어서 덮어쓴다 ----
    ; -DTAP1_RX_PIN=16   ; 포트1 <- MAX3232 R1OUT
    ; -DTAP2_RX_PIN=26   ; 포트2 <- MAX3232 R2OUT
    ;
    ; 보레이트와 프레임 형식은 빌드가 아니라 런타임에 바꾼다.
    ;   baud <n> / format <fmt> / scan
