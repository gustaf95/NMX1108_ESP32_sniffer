; NMX-1108 / NMX-1106 RS-232C 브리지 스니퍼
; ESP32 38-pin dev board / Arduino framework
;
;   pio run -t upload      빌드 + 업로드
;   pio device monitor     115200 bps

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    ; ---- UART 핀 변경이 필요하면 아래 주석을 풀어서 덮어쓴다 ----
    ; -DCTRL_RX_PIN=16   ; 컨트롤러 TxD  -> MAX3232 #1 -> ESP32
    ; -DCTRL_TX_PIN=17   ; ESP32 -> MAX3232 #1 -> 컨트롤러 RxD
    ; -DMAIN_RX_PIN=26   ; 본체 TxD -> MAX3232 #2 -> ESP32
    ; -DMAIN_TX_PIN=27   ; ESP32 -> MAX3232 #2 -> 본체 RxD
